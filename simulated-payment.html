<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulated Payment Page</title>
    <style>
        body { font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f3f4f6; margin: 0; }
        .card { background: white; padding: 2rem; borderRadius: 1rem; boxShadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #111827; margin-bottom: 2rem; }
        .btn-group { display: flex; flex-direction: column; gap: 1rem; }
        .pay-btn { padding: 1rem 2rem; font-size: 1rem; font-weight: 600; color: white; background-color: #111827; border: none; borderRadius: 0.5rem; cursor: pointer; transition: background 0.2s; }
        .pay-btn:hover { background-color: #1f2937; }
        #status { margin-top: 2rem; font-weight: 600; color: #10b981; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Simulated Payments</h1>
        <div class="btn-group">
            <button class="pay-btn" data-amount="500" data-receiver="Swiggy">Pay ₹500 to Swiggy</button>
            <button class="pay-btn" data-amount="499" data-receiver="Netflix">Pay ₹499 to Netflix</button>
            <button class="pay-btn" data-amount="300" data-receiver="Uber">Pay ₹300 to Uber</button>
            <button class="pay-btn" data-amount="1200" data-receiver="Amazon">Pay ₹1200 to Amazon</button>
        </div>
        <p id="status">Payment simulated! Detection pending...</p>
    </div>

    <script>
        document.querySelectorAll('.pay-btn').forEach(button => {
            button.addEventListener('click', () => {
                const status = document.getElementById('status');
                status.style.display = 'block';
                status.innerText = `Simulated payment of ₹${button.getAttribute('data-amount')} to ${button.getAttribute('data-receiver')}!`;
                
                // For demonstration, we'll also print a log that the extension can easily see
                console.log("PAYMENT_DETECTED", {
                    amount: button.getAttribute('data-amount'),
                    receiver: button.getAttribute('data-receiver')
                });
            });
        });
    </script>
</body>
</html>
